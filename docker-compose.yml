x-app-env: &app-env
  DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
  SQS_ENDPOINT: http://ministack:4566
  AWS_REGION: us-east-1
  LOG_LEVEL: info

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "max_connections=300"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  ministack:
    image: ministackorg/ministack:latest
    ports:
      - "4566:4566"

  # Creates the FIFO queues (main + DLQ with redrive policy + events) once MiniStack is up.
  ministack-init:
    build: .
    depends_on:
      - ministack
    environment:
      <<: *app-env
    command: ["bun", "run", "scripts/create-queues.ts"]
    restart: "no"

  # Applies migrations exactly once, before any app replica starts.
  migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
    command: ["bun", "run", "scripts/migrate.ts", "up"]
    restart: "no"

  app:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
      ministack-init:
        condition: service_completed_successfully
    environment:
      <<: *app-env
    ports:
      - "3000-3002:3000"
    deploy:
      replicas: 3
    # Time for SIGTERM draining (in-flight SQS messages, outbox batch) before SIGKILL.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/ready >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
